services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - parking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 3s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://parking:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/parking
      DEMO_MODE: ${DEMO_MODE:-true}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-demo-local}
    depends_on:
      db:
        condition: service_healthy
volumes:
  parking-data:
